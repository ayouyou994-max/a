name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/keen-planck-afdt8n]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (only the published files)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp gantry.html _site/gantry.html
          # SPA/static safety: serve index.html for unknown paths
          cp index.html _site/404.html
          # 3D runtime + assets (Three.js, Draco, glTF model, HDRI)
          cp -r vendor _site/vendor
          cp -r assets _site/assets
          touch _site/.nojekyll

      - name: Configure Pages (enables Pages if not already on)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
